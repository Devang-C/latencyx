[build-system]
requires = ["setuptools>=65.0", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "latencyx"
dynamic = ["version"]
description = "Zero-config latency tracking for FastAPI and Flask"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Devang Chavan", email = "devangchavan0204@gmail.com"}]
keywords = ["monitoring", "observability", "fastapi", "tracing", "latency"]

dependencies = [
    "starlette>=0.27.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.scripts]
latencyx = "latencyx.cli:main"

[project.optional-dependencies]
http = ["httpx>=0.24.0"]
flask = ["flask>=2.0"]
sqlalchemy = ["sqlalchemy>=1.4", "aiosqlite>=0.19"]
serve = ["fastapi>=0.100.0", "uvicorn>=0.24.0"]
all = ["httpx>=0.24.0", "flask>=2.0", "sqlalchemy>=1.4", "aiosqlite>=0.19", "rich>=13.0", "typer>=0.12", "fastapi>=0.100.0", "uvicorn>=0.24.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "fastapi>=0.100.0",
    "httpx>=0.24.0",
    "flask>=2.0",
    "sqlalchemy>=1.4",
    "aiosqlite>=0.19",
    "ruff>=0.4.0",
    "mypy>=1.8",
    "pre-commit>=3.0",
]

[tool.setuptools]
packages = ["latencyx", "latencyx.exporters", "latencyx.instrumentors", "latencyx.cli", "latencyx.cli.commands", "latencyx.ui"]

[tool.setuptools.package-data]
"latencyx.ui" = ["*.html"]

[tool.setuptools_scm]

# --- Ruff ---
[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008",   # do not perform function calls in default arguments
]

[tool.ruff.lint.per-file-ignores]

# --- Mypy ---
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=latencyx",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
    "--cov-config=pyproject.toml",
]

[tool.coverage.run]
omit = [
    "latencyx/cli/*",
    "latencyx/__main__.py",
    "latencyx/serve.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "except ImportError",
]
