[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latencyx"
version = "0.1.0"
description = "Zero-config latency tracking for FastAPI (and later more)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Devang Chavan", email = "devangchavan0204@gmail.com"}]
keywords = ["monitoring", "observability", "fastapi", "tracing", "latency"]

dependencies = [
    "starlette>=0.27.0",
]

[project.scripts]
latencyx = "latencyx.cli:main"

[project.optional-dependencies]
http = ["httpx>=0.24.0"]
all = ["httpx>=0.24.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "fastapi>=0.100.0",
    "httpx>=0.24.0",
    "ruff>=0.4.0",
    "mypy>=1.8",
    "pre-commit>=3.0",
]

[tool.setuptools]
packages = ["latencyx", "latencyx.exporters", "latencyx.instrumentors"]

# --- Ruff ---
[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008",   # do not perform function calls in default arguments
]

# --- Mypy ---
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=latencyx",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
    "--cov-config=pyproject.toml",
]

[tool.coverage.run]
omit = [
    "latencyx/cli.py",
    "latencyx/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "except ImportError",
]
